[project]
name = "eci-candidate-photos"
version = "0.1.0"
description = "Candidate photographs from the Election Commission of India's results pages, joined to in-rolls/eci_results"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["India", "elections", "ECI", "candidates", "photographs"]
dependencies = [
    "beautifulsoup4>=4.13",
    "indic-transliteration>=2.3.82",
    "lxml>=6.1.3",
    "pandas>=2.2",
    "pillow>=11",
    "rapidfuzz>=3.14.6",
    "requests>=2.32",
    "scipy>=1.18.1",
    "tenacity>=9",
]

[project.urls]
Repository = "https://github.com/in-rolls/eci_candidate_photos"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_candidate_photos"]

[dependency-groups]
dev = ["black>=25", "isort>=6", "flake8>=7", "pytest>=8"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
